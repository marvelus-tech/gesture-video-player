<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=./">
  <link rel="canonical" href="./">
  <title>Redirecting to Gesture Video Player...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #09090B;
      color: #F4F1EA;
      letter-spacing: 0.01em;
    }
    .redirect-message {
      text-align: center;
    }
    .redirect-message h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #F4F1EA;
      letter-spacing: 0.01em;
    }
    .redirect-message p {
      color: #A39E94;
      font-size: 14px;
    }
    .redirect-message a {
      color: #D4A574;
      text-decoration: none;
      transition: opacity 160ms cubic-bezier(0.22, 1, 0.32, 1);
    }
    .redirect-message a:hover {
      opacity: 0.8;
    }
  </style>
  <script>
    window.location.replace('./');
  </script>
</head>
<body>
  <div class="redirect-message">
    <h1>Redirecting...</h1>
    <p>The demo has moved to <a href="./">the homepage</a>.</p>
  </div>
</body>
</html>
